<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#08131f"><title>Alpine Rush X</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08131f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#load{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 32%,#21466c,#08131f 70%)}#load b{font-size:30px;letter-spacing:-.04em}#load small{display:block;margin-top:12px;opacity:.68;letter-spacing:.16em;font-weight:800}</style></head><body><div id="load"><div><b>ALPINE RUSH X</b><small>LOADING THE MOUNTAIN</small></div></div><script>(async()=>{try{let s='';for(let i=1;i<=7;i++){const n=String(i).padStart(2,'0');const r=await fetch(`part-${n}.txt`);if(!r.ok)throw Error(`Asset ${n} failed`);s+=(await r.text()).trim()}const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('load').innerHTML='<div><b>Unable to start</b><small>Reload this page in Safari.</small></div>'}})();</script></body></html>
