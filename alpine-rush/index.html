<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#08131f"><title>Alpine Rush X</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08131f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#load{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 32%,#21466c,#08131f 70%)}#load b{font-size:30px;letter-spacing:-.04em}#load small{display:block;margin-top:12px;opacity:.68;letter-spacing:.16em;font-weight:800}</style></head><body><div id="load"><div><b>ALPINE RUSH X</b><small>LOADING THE MOUNTAIN</small></div></div><script>(async()=>{try{let s='';const files=['part-01.txt','part-02.txt','part-03.txt','part-04a.txt','part-04b.txt','part-05.txt','part-06.txt','part-07.txt'];for(const file of files){const r=await fetch(file);if(!r.ok)throw Error(`${file} failed`);s+=(await r.text()).trim()}const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();html=html.replace("async function startRun(mode='classic'){\n  dailyMode=mode==='daily';resumeAudio();if(controlMode==='tilt')await enableMotion();resetRun();$('splash').classList.add('hide');$('menu').classList.add('hide');$('result').classList.add('hide');$('pauseScreen').classList.add('hide');$('settingsDrawer').classList.add('hide');$('tutorial').classList.add('hide');gameState='intro';introTimer=1.15;countdown=2.75;showMessage(dailyMode?'DAILY DROP':'READY',.6);flash('255,255,255',.18);syncHUD();\n}","function startRun(mode='classic'){\n  if(['intro','countdown','playing'].includes(gameState))return;\n  dailyMode=mode==='daily';resumeAudio();\n  if(controlMode==='tilt'){touchSteer=0;Promise.resolve(enableMotion()).catch(()=>{})}\n  try{resetRun();$('splash').classList.add('hide');$('menu').classList.add('hide');$('result').classList.add('hide');$('pauseScreen').classList.add('hide');$('settingsDrawer').classList.add('hide');$('tutorial').classList.add('hide');gameState='intro';introTimer=1.15;countdown=2.75;showMessage(dailyMode?'DAILY DROP':'READY',.6);flash('255,255,255',.18);syncHUD();}catch(err){console.error('Run start failed',err);controlMode='touch';localStorage.setItem('arxControl','touch');syncSettings();showError('Could not start the run. Reload Safari and try again.')}\n}");html=html.replace("function resumeAudio(){if(audioCtx?.state==='suspended')audioCtx.resume();if(audioCtx)musicNextTime=Math.max(musicNextTime,audioCtx.currentTime+.05)}","function resumeAudio(){try{if(audioCtx?.state==='suspended'){const r=audioCtx.resume();if(r&&typeof r.catch==='function')r.catch(()=>{})}if(audioCtx)musicNextTime=Math.max(musicNextTime,audioCtx.currentTime+.05)}catch(err){console.warn('Audio resume skipped',err)}}");document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('load').innerHTML='<div><b>Unable to start</b><small>Reload this page in Safari.</small></div>'}})();</script></body></html>
