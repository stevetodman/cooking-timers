name: Deploy Alpine Rush X to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alpine-rush-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out game branch
        uses: actions/checkout@v4
        with:
          ref: alpine-rush-host

      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: alpine-rush

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
